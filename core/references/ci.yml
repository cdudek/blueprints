# Consumer workflow template: copy to .github/workflows/ci.yml and adapt the toolchain steps.
# Runs only on ready (non-draft) pull requests, never on push. `ci` is the one required check.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner compares against the PR base (ratchets, docs-only selection).
      CI_LOCAL_BASE_REF: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Adapt to the repo's toolchain; delete what it does not use.
      # Node: version comes from .nvmrc, packages from pnpm.
      # - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      #   with:
      #     node-version-file: .nvmrc
      #     cache: pnpm
      # - run: pnpm install --frozen-lockfile
      # Python: uv resolves the interpreter and dependencies from pyproject.toml and uv.lock.
      # - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # - run: uv sync --locked
      - name: Run every check except LOCAL_ONLY_CHECKS
        run: bash scripts/ci-local --ci

  # Information only: reports the decision class in the PR, never blocks.
  # Pin to the merge SHA of cdudek/blueprints that carries the information-only workflow.
  decision4:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: read
    uses: cdudek/blueprints/.github/workflows/decision4-check.yml@0000000000000000000000000000000000000000 # replace with the merge SHA

  # The required check. It is skipped for drafts, which cannot merge anyway.
  ci:
    name: ci
    needs: [checks]
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          test "$RESULT" = success
