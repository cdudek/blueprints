# Decision4 v1.0.1 boundary map
version: 1
precedence: highest-floor-wins
entries:
  - select:
      paths: ["core/**"]
    floor: Repair
    put_right: "The blueprint is read by agents building products; a wrong rule is fixed forward in a new PR, and products that already followed it need their own follow-up"
    answerer: "Owner"
  - select:
      paths: ["boundary-map.yaml", ".github/**", "tests/decision4/**"]
    floor: Migrate
    put_right: "The shared gate contract changes; consuming teams must coordinate their pinned versions to recover"
    answerer: "Owner"
