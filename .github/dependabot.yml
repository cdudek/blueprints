version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
        update-types: [minor, patch]
    # Major upgrades stay individual PRs.
