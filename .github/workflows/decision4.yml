name: Decision4

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: decision4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  decision4:
    # The shared host exercises the proposed workflow; consumers pin its merge SHA.
    uses: ./.github/workflows/decision4-check.yml
