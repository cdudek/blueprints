name: fastapi

# The FastAPI template's own CI (fastapi/template/.github/workflows/ci.yml), run here on the
# template folder. Keep the two in step.
on:
  pull_request:
    paths: ["fastapi/**", ".github/workflows/fastapi.yml"]
  push:
    branches: [main]
    paths: ["fastapi/**", ".github/workflows/fastapi.yml"]

concurrency:
  group: fastapi-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository or talks to a cloud account.
permissions:
  contents: read

env:
  UV_VERSION: "0.12.2"
  GITLEAKS_VERSION: "8.30.1"
  # The CI Postgres service: a throwaway container, not a secret.
  DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app


defaults:
  run:
    working-directory: fastapi/template

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the ratchets compare with the merge base; the secret scan reads history
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - name: make check
        run: make check
        env:
          # PRs compare with the merge base of the target branch; pushes with the previous commit.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  images:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app" --health-interval 2s --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build web, worker and migrate
        run: make docker-build IMAGE=app
      - name: migrate applies every migration to an empty database
        run: docker run --rm --network host -e DATABASE_URL app-migrate
      - name: web becomes ready
        run: |
          docker run -d --name web --network host -e DATABASE_URL app-web
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/readyz && exit 0
            sleep 1
          done
          docker logs web
          exit 1
      - name: worker loads its tasks and reaches the database
        run: docker run --rm --network host -e DATABASE_URL app-worker procrastinate --app=app.worker.app healthchecks
