name: Sources check

on:
  schedule:
    - cron: '17 8 1 * *'
  workflow_dispatch:

concurrency:
  group: sources-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sources-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source tags and reconcile the Source updates issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/sources_check.py
