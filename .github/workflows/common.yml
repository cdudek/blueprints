name: common

on:
  pull_request:
    paths: ["common/**", ".github/workflows/common.yml"]
  push:
    branches: [main]
    paths: ["common/**", ".github/workflows/common.yml"]

concurrency:
  group: common-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repository or talks to a cloud account.
permissions:
  contents: read

env:
  BATS_VERSION: v1.14.0
  TERRAFORM_VERSION: 1.17.1

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        working-directory: common
        run: |
          shellcheck -x secrets/secrets secrets/backends/*.bash secrets/test/stub/gcloud \
            secrets/test/*.bash secrets/test/*.bats secrets/test/fixtures/app/probes/*.sh \
            make/test/*.bats terraform/secrets/test/*.bats

  bats:
    # Linux runs bash 5; macOS runs the CLI under /bin/bash, which is 3.2.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SECRETS_BASH: ${{ matrix.os == 'macos-latest' && '/bin/bash' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - name: install bats-core
        run: git clone --depth 1 --branch "$BATS_VERSION" https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
      - name: bash and jq versions
        run: |
          "$SECRETS_BASH" --version | head -1
          jq --version
      - name: secrets CLI and Make contract
        run: '"$RUNNER_TEMP/bats/bin/bats" common/secrets/test common/make/test'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: install bats-core
        run: git clone --depth 1 --branch "$BATS_VERSION" https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
      # fmt, init -backend=false, validate (module and example), and an offline plan with no value in it.
      - name: terraform module
        run: '"$RUNNER_TEMP/bats/bin/bats" common/terraform/secrets/test'
